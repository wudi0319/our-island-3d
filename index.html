<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>我们的小岛 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#bfe6ff;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"PingFang SC",sans-serif}
canvas{display:block}
#title{position:fixed;top:calc(env(safe-area-inset-top) + 8px);left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #0006;pointer-events:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top) + 32px);left:0;right:0;text-align:center;color:#fff;font-size:11px;text-shadow:0 1px 2px #0006;pointer-events:none}
#pal{position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 52px);display:flex;gap:6px;overflow-x:auto;padding:4px}
#pal button,.btn{border:2px solid #fff;border-radius:12px;background:#ffffffb0;font-size:12px;padding:4px 6px;white-space:nowrap;color:#5a3e2b;font-family:inherit}
#pal button i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:3px;vertical-align:-2px;border:1px solid #0003}
#pal button.on{background:#ffd98a;border-color:#ff9a5a}
#tools{position:fixed;right:10px;top:calc(env(safe-area-inset-top) + 92px);display:flex;flex-direction:column;gap:6px}
#mode.del{background:#ffb3b3}
#joy{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:120px;height:120px;border-radius:50%;background:#ffffff40;border:2px solid #fff8}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffd}
#jump{position:fixed;right:28px;bottom:calc(env(safe-area-inset-bottom) + 40px);width:84px;height:84px;border-radius:50%;border:2px solid #fff;background:#ffffffa0;font-size:18px;font-weight:700;color:#5a3e2b;font-family:inherit}
#bubble{position:fixed;padding:4px 8px;background:#fff;border-radius:10px;font-size:13px;display:none;pointer-events:none;transform:translate(-50%,-100%)}
</style></head><body>
<div id="title">🏝️ 我们的小岛 3D · 方块版</div>
<div id="hint">摇杆走路 · 拖动转视角 · 双指缩放 · 点方块盖房子</div>
<div id="pal"></div>
<div id="tools"><button class="btn" id="mode">🧱 放置</button><button class="btn" id="reset">↺ 重置</button></div>
<div id="joy"><div id="knob"></div></div><button id="jump">跳</button><div id="bubble"></div>
<script type="module" src="game.js?v=4"></script></body></html>
