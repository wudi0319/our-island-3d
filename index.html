<!doctype html><html lang="zh"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>我们的小岛 3D</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#8fd3ff;touch-action:none;-webkit-user-select:none;user-select:none;font-family:-apple-system,"PingFang SC",sans-serif}
canvas{display:block}
#title{position:fixed;top:calc(env(safe-area-inset-top) + 10px);left:0;right:0;text-align:center;color:#fff;font-weight:700;text-shadow:0 1px 3px #0006;pointer-events:none}
#hint{position:fixed;top:calc(env(safe-area-inset-top) + 36px);left:0;right:0;text-align:center;color:#fff;font-size:12px;text-shadow:0 1px 2px #0006;pointer-events:none}
#joy{position:fixed;left:24px;bottom:calc(env(safe-area-inset-bottom) + 24px);width:120px;height:120px;border-radius:50%;background:#ffffff40;border:2px solid #fff8}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#fffd}
#bubble{position:fixed;padding:4px 8px;background:#fff;border-radius:10px;font-size:13px;display:none;pointer-events:none;transform:translate(-50%,-100%)}
</style></head><body>
<div id="title">🏝️ 我们的小岛 3D · 试玩版</div>
<div id="hint">左下摇杆走路 · 拖动屏幕转视角 · 双指缩放</div>
<div id="joy"><div id="knob"></div></div><div id="bubble"></div>
<script type="module" src="game.js?v=1"></script></body></html>
